name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check sources and verify the committed bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Parse check, markup-handler resolution, and ESLint.
      - name: Check
        run: npm run check

      # bundle.js is committed, so it can drift from js/. Rebuild and compare.
      # Line 1 is a random cache-busting header, so it is excluded; the rest of
      # the output is deterministic for a given esbuild version and input.
      - name: Verify the committed bundle is up to date
        run: |
          cp bundle.js /tmp/committed-bundle.js
          npm run build
          if ! diff -q <(tail -n +2 /tmp/committed-bundle.js) <(tail -n +2 bundle.js) >/dev/null; then
            echo "::error::bundle.js is stale — run 'npm run build' and commit the result."
            exit 1
          fi
          echo "bundle.js matches a fresh build of the sources."

  deploy:
    name: Publish to GitHub Pages
    # Manual only: the app re-fetches its bundle from this URL on every launch,
    # so whatever is published is what every user runs immediately. Run this
    # from the Actions tab once main looks good.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          API_ENCODED: ${{ secrets.API_ENCODED }}
          API_LEGACY_ENCODED: ${{ secrets.API_LEGACY_ENCODED }}
          API_EXT2_LEGACY: ${{ secrets.API_EXT2_LEGACY }}
        run: npm run build

      # Only what the app fetches at runtime: the bundle under both entry names,
      # the rating icons that are still referenced by URL, and the CHANGELOG and
      # VERSION files read by loadChangelog() and checkNewVersion().
      - name: Assemble the site
        env:
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          mkdir -p _site
          cp -r img _site/
          cp CHANGELOG VERSION README.md _site/
          cp bundle.js bundle.min.js _site/
          # The host may use either entry name, and the published tree carries no
          # js/ directory, so application.js has to be the bundle too.
          cp bundle.js _site/application.js
          touch _site/.nojekyll
          # A custom domain can only be claimed by one repository, so this fork
          # must not reuse the upstream's. Prefer Settings -> Pages; this is here
          # for the case where you want the domain pinned in the artifact.
          if [ -n "$PAGES_CNAME" ]; then
            echo "$PAGES_CNAME" > _site/CNAME
          fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
